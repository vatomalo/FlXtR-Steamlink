name: Android preview
on:
  push:
    branches: [feature/android]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Build and lint
        run: bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FlXtR-Android-preview
          path: dist/FlXtR-Android-preview.apk
          if-no-files-found: error
