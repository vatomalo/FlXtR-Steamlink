name: Secret of Mana combo build checks
on:
  push:
    branches:
      - feature/som-disciplines-controls-20261114
      - fix/som-ai-brain-20261119
      - fix/android-npc-memory-build-output-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proxy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run C proxy regression tests
        run: |
          make test-som-ai-proxy test-som-ai-player2 test-som-combo test-som-songs test-som-net-pad
          cc -std=c11 -Wall -Wextra -Werror -Isrc tests/som_disciplines_test.c -o /tmp/som-disciplines-test
          /tmp/som-disciplines-test
      - name: Python tests (AI bridge, planner, soundtrack, headless harness; no ROM)
        run: |
          PYTHONPATH=tools python3 -m unittest discover -s tools -p 'test_som_*.py'
          python3 -m unittest discover -s tests -p 'test_flxtr_build_recovery.py'
          python3 -m unittest discover -s tests -p 'build_portal_test.py'
      - name: Build the headless harness with warnings as errors
        run: |
          cc -std=gnu99 -Wall -Wextra -Werror -o /tmp/som-harness tools/som_headless/som_harness.c -ldl
      - name: Build native Linux diagnostic proxy
        run: |
          mkdir -p build/som-ai
          cc -Os -std=c99 -Wall -Wextra -Werror -fPIC -shared src/som_ai_proxy.c -o build/som-ai/som_ai_proxy_libretro-linux.so -ldl
          file build/som-ai/som_ai_proxy_libretro-linux.so
      - uses: actions/upload-artifact@v4
        with:
          name: som-ai-proxy-linux-diagnostic
          path: build/som-ai/som_ai_proxy_libretro-linux.so
