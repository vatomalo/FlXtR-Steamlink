name: Windows port foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and Linux regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64-posix build-essential pkg-config libsdl2-dev libsdl2-image-dev libcurl4-openssl-dev libjson-c-dev libssl-dev
      - name: Test POSIX platform and existing callers
        run: |
          make -j2 all
          make test-platform test-platform-shell
          cc -std=c99 -Wall -Wextra -Werror tests/child_exec_test.c -o build/child-exec-test
          ./build/child-exec-test
          cc -std=c99 -Wall -Wextra -Werror tests/phone_state_test.c -o build/phone-state-test
          ./build/phone-state-test
      - name: Cross-compile Windows platform tests
        run: bash scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-platform-foundation
          path: |
            build/windows-platform/FlXtR-windows-platform-test.exe
            dist/FlXtR-Windows-platform-x86_64.zip
            dist/FlXtR-Windows-platform-x86_64.zip.sha256
  windows-runtime:
    needs: cross-build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-platform-foundation
          path: downloaded
      - name: Run native Windows tests from a path with spaces and Unicode
        shell: pwsh
        run: |
          $exe = Get-ChildItem downloaded -Recurse -Filter FlXtR-windows-platform-test.exe | Select-Object -First 1
          $folder = Join-Path $env:RUNNER_TEMP 'FlXtR Windows ø test'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item -LiteralPath $exe.FullName -Destination $folder
          Push-Location $folder
          try {
            & .\FlXtR-windows-platform-test.exe
            if ($LASTEXITCODE -ne 0) { throw "Platform tests failed: $LASTEXITCODE" }
          } finally { Pop-Location }
