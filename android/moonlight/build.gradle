plugins { id 'com.android.library' }
android {
    namespace 'com.limelight'
    compileSdk 35
    ndkVersion '28.0.13004108'
    defaultConfig {
        minSdk 26
        buildConfigField 'boolean', 'ROOT_BUILD', 'false'
        buildConfigField 'String', 'APPLICATION_ID', '"org.flxtr.android"'
        ndk { abiFilters.addAll((project.findProperty('flxtrAbis') ?: 'armeabi-v7a,arm64-v8a').split(',')) }
        externalNativeBuild { ndkBuild { arguments 'PRODUCT_FLAVOR=nonRoot' } }
    }
    buildFeatures { buildConfig true; resValues true }
    sourceSets.main {
        manifest.srcFile 'AndroidManifest.xml'
        java.srcDirs = ['../build/game-sources/moonlight/app/src/main/java']
        res.srcDirs = ['../build/game-sources/moonlight/app/src/main/res']
        assets.srcDirs = ['../build/game-sources/moonlight/app/src/main/assets']
    }
    defaultConfig {
        resValue 'string', 'app_label', 'Moonlight in FlXtR'
        resValue 'string', 'app_label_root', 'Moonlight in FlXtR'
    }
    externalNativeBuild { ndkBuild { path '../build/game-sources/moonlight-native/Android.mk' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8; coreLibraryDesugaringEnabled true }
    // Match upstream's localization policy; integration code retains full lint.
    lint { disable 'MissingTranslation'; lintConfig file('lint.xml') }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jmdns:jmdns:3.6.3'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
}

